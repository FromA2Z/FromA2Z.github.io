short_bio: >-
  <p>
    I am currently a Ph.D. student in Artificial Intelligence at The Hong Kong University of Science and Technology (Guangzhou),
    advised by Prof. Zeke Xie. My research focuses on generative AI and video foundation models — generation quality,
    temporal consistency, controllability and efficiency — including post-training for video diffusion models,
    consistency-based distillation, sampling and inference analysis, and real-time streaming audio-video generation.
    I am also interested in the mechanistic analysis of multimodal models.
  </p>
  <p>
    I received my M.Eng. degree from Tsinghua Shenzhen International Graduate School, Tsinghua University (supervised by
    Prof. Hai-Tao Zheng) in 2025, and my B.Eng. degree from the College of Computer Science, Sichuan University in 2022.
  </p>

