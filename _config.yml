# Site settings
baseurl: "" # the subpath of your site, e.g. /blog (empty for root domain)
url: "https://FromA2Z.github.io"

title: "Lichen Bai"
tagline: "Ph.D. Student at HKUST (Guangzhou)"
author: "Lichen Bai"
description: >-
  Lichen Bai (白立忱) is a Ph.D. student in Artificial Intelligence at The Hong Kong University of
  Science and Technology (Guangzhou), working on generative AI, video foundation models, diffusion
  post-training and distillation.
lang: en

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (GitHub Pages allowlist only)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

collections:
  publications:
  news:

defaults:
  - scope:
      path: ""
      type: posts
    values:
      image: /assets/images/og.png
  - scope:
      path: ""
      type: publications
    values:
      image: /assets/images/og.png

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
