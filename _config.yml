# Site settings
baseurl: "" # the subpath of your site, e.g. /blog (empty for root domain)
url: "https://FromA2Z.github.io"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (GitHub Pages allowlist only)
plugins:
  - jekyll-sitemap
  - jekyll-feed

collections:
  publications:
  news:

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
